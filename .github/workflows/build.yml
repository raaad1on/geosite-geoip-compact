name: Build compact geosite / geoip / srs

on:
  push:
    branches:
      - main
      - master
    # Коммит dist ботом с [skip ci] не должен зацикливать workflow
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:
  schedule:
    # Ежедневно 03:00 UTC — свежие .dat + .srs в релизе latest
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Нужен для force-move тега latest и push после коммита dist
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prepare GOPATH and PATH
        run: |
          echo "GOPATH=$HOME/go" >> $GITHUB_ENV
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install tools (geoview, v2dat)
        run: |
          go install github.com/snowie2000/geoview@latest
          go install github.com/urlesistiana/v2dat@latest

      # sing-box CLI: compile JSON→.srs, decompile, match, check (как у SagerNet/sing-geosite по смыслу)
      - name: Install sing-box
        env:
          SING_BOX_VERSION: '1.11.15'
        run: |
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz" \
            | tar -xz
          sudo install -m 755 "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Clone domain-list-community
        run: |
          git clone --depth=1 https://github.com/v2fly/domain-list-community.git

      - name: Save pristine category-ru (includes intact)
        run: |
          mkdir -p work
          cp domain-list-community/data/category-ru work/category-ru.original

      # Эталон: полный resolve / @-фильтры / polishList в официальном коде v2fly
      - name: Build reference dlc.dat
        run: |
          cd domain-list-community
          go run ./

      - name: Unpack official category-ru from dlc.dat
        run: |
          mkdir -p work/dlc-unpack
          v2dat unpack geosite -o work/dlc-unpack -f category-ru domain-list-community/dlc.dat

      - name: Download RunetFreedom geosite.dat
        run: |
          curl -fsSL -o work/runetfreedom-geosite.dat \
            https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat

      - name: Unpack RunetFreedom lists
        run: |
          mkdir -p work/runetfreedom-unpack
          v2dat unpack geosite -o work/runetfreedom-unpack \
            -f category-ru -f category-gov-ru -f ru-available-only-inside \
            work/runetfreedom-geosite.dat

      # Не заменяем весь category-ru плоским списком (повторный polishList съедает правила).
      # Дописываем только отсутствующие в официальном unpack строки RunetFreedom.
      - name: Append RunetFreedom extras to category-ru
        run: |
          python3 scripts/append_runet_extras_to_category_ru.py \
            work/category-ru.original \
            work/dlc-unpack/dlc_category-ru.txt \
            work/runetfreedom-unpack \
            -o domain-list-community/data/category-ru

      - name: Rebuild dlc.dat with extended category-ru
        run: |
          cd domain-list-community
          go run ./

      - name: Download upstream geoip.dat (Loyalsoldier)
        run: |
          mkdir -p work
          curl -fsSL -o work/geoip.dat \
            https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat

      - name: Build compact geosite.dat from dlc
        run: |
          mkdir -p dist
          geoview -type geosite -action convert \
            -input domain-list-community/dlc.dat \
            -list "private,category-ru,category-ads,PRIVATE,CATEGORY-RU,CATEGORY-ADS" \
            -output dist/geosite-compact.dat \
            -format geosite \
            -strict=false

      - name: Build compact geoip.dat (RU, PRIVATE)
        run: |
          mkdir -p dist
          geoview -type geoip -action convert \
            -input work/geoip.dat \
            -list "RU,PRIVATE" \
            -output dist/geoip-compact.dat \
            -format geoip \
            -strict=false

      - name: Verify geoip-compact contains tag ru
        run: |
          mkdir -p work/geoip-verify
          v2dat unpack geoip -o work/geoip-verify -f ru dist/geoip-compact.dat
          f=$(ls work/geoip-verify/*_ru.txt)
          if [ ! -s "$f" ]; then
            echo "geoip-compact: empty ru list"
            exit 1
          fi
          echo "geoip ru rules: $(wc -l < "$f")"

      - name: Export text lists for verification
        run: |
          mkdir -p dist/text
          v2dat unpack geoip -o dist/text -f ru -f private dist/geoip-compact.dat
          v2dat unpack geosite -o dist/text -f private -f category-ru -f category-ads dist/geosite-compact.dat
          printf '%s\n' \
            'О текстовом дампе geosite-compact_category-ru.txt' \
            '-----------------------------------------------' \
            'В списке намеренно нет многих отдельных *.ru (nalog.ru, gosuslugi.ru и т.д.),' \
            'если уже есть правило зоны "ru" (tld-ru): domain-list-community удаляет' \
            'избыточные поддомены (polishList). В Xray geosite:category-ru матчит' \
            'эти хосты через правило на зону .ru. См. README репозитория.' \
            > dist/text/README-category-ru.txt

      - name: Sanity check category-ru is not empty
        run: |
          if [ ! -s dist/text/geosite-compact_category-ru.txt ]; then
            echo "category-ru list is empty"
            exit 1
          fi

      # Те же списки, что в .txt, в виде JSON-массива строк
      - name: Export domain/CIDR lists as JSON arrays
        run: |
          python3 scripts/export_lists_json.py --dir dist/text
          test -s dist/text/geosite-compact_category-ru.json
          python3 -c "import json; d=json.load(open('dist/text/geosite-compact_category-ru.json')); assert isinstance(d,list) and len(d)>0; print('category-ru json:', len(d))"

      # geoview → JSON (version 1) → sing-box rule-set compile → .srs
      # + match nalog.ru/gosuslugi.ru + sing-box check с local binary rule_set
      - name: Build and validate sing-box SRS rule-sets
        run: |
          chmod +x scripts/build_and_validate_srs.sh
          ./scripts/build_and_validate_srs.sh

      - name: Assert release artifacts exist
        run: |
          set -e
          for f in \
            dist/geoip-compact.dat \
            dist/geosite-compact.dat \
            dist/srs/geoip-ru.srs \
            dist/srs/geoip-private.srs \
            dist/srs/geosite-category-ru.srs \
            dist/srs/geosite-private.srs \
            dist/srs/geosite-category-ads.srs
          do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
            echo "OK $(wc -c < "$f") bytes  $f"
          done

      # Дифф текстовых списков/хешей vs предыдущий коммит → notes + dist/CHANGELOG.md
      - name: Generate database changelog
        id: changelog
        run: |
          set -e
          python3 scripts/generate_dist_changelog.py \
            --history-only-if-changed \
            --out work/changelog_section.md
          if grep -qx '1' work/dist_materially_changed; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # GITHUB_ENV нельзя использовать в if: следующего шага — только job outputs / step outputs.
      # dist/ включает .dat, text/*.txt, srs/*.srs и CHANGELOG.md
      - name: Commit dist if changed
        id: commit_dist
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dist
            git commit -m "Update compact geosite/geoip/srs [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
            echo "dist_committed=true" >> $GITHUB_OUTPUT
          else
            echo "No changes in dist, nothing to commit."
            echo "dist_committed=false" >> $GITHUB_OUTPUT
          fi

      # Всегда обновляем latest на schedule/dispatch/push/main (ассеты + notes с диффом).
      - name: Prepare GitHub Release (notes + tag latest → HEAD)
        id: release_prep
        if: |
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
          (steps.commit_dist.outputs.dist_committed == 'true' ||
           github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch' ||
           github.event_name == 'push')
        run: |
          set -e
          HEAD_SHA="$(git rev-parse HEAD)"
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/latest"
          DAY_TAG="$(date -u +'%Y.%m.%d')"
          if git rev-parse -q --verify "refs/tags/${DAY_TAG}" >/dev/null; then
            DAY_TAG="${DAY_TAG}-r${{ github.run_number }}"
          fi
          echo "day_tag=${DAY_TAG}" >> $GITHUB_OUTPUT
          {
            echo "**Сборка (UTC):** $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo "**Коммит:** \`${HEAD_SHA}\`"
            echo "**Событие:** \`${{ github.event_name }}\`"
            echo "**Workflow:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "### Состав"
            echo "- \`geoip-compact.dat\`, \`geosite-compact.dat\` — Xray"
            echo "- \`geoip-ru.srs\`, \`geosite-category-ru.srs\` (+ private, category-ads) — sing-box"
            echo "- \`CHANGELOG.md\` — накопленная краткая история диффов"
            echo "- \`*.txt\` / \`*.json\` — распакованные списки (текст и JSON-массив)"
            echo ""
            cat work/changelog_section.md
            echo ""
            echo "### Стабильные ссылки (\`latest\` — всегда перезаписывается)"
            echo "- [geoip-compact.dat](${BASE}/geoip-compact.dat)"
            echo "- [geosite-compact.dat](${BASE}/geosite-compact.dat)"
            echo "- [geoip-ru.srs](${BASE}/geoip-ru.srs)"
            echo "- [geoip-private.srs](${BASE}/geoip-private.srs)"
            echo "- [geosite-category-ru.srs](${BASE}/geosite-category-ru.srs)"
            echo "- [geosite-private.srs](${BASE}/geosite-private.srs)"
            echo "- [geosite-category-ads.srs](${BASE}/geosite-category-ads.srs)"
            echo "- [geosite-compact_category-ru.json](${BASE}/geosite-compact_category-ru.json)"
            echo "- [geoip-compact_ru.json](${BASE}/geoip-compact_ru.json)"
            echo "- [CHANGELOG.md](${BASE}/CHANGELOG.md)"
          } > release_notes.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa latest "${HEAD_SHA}" -m "Latest compact geo + srs build"
          git push -f origin refs/tags/latest

      - name: Create or update GitHub Release (latest)
        if: |
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
          (steps.commit_dist.outputs.dist_committed == 'true' ||
           github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch' ||
           github.event_name == 'push')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          make_latest: true
          body_path: release_notes.md
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/geoip-compact.dat
            dist/geosite-compact.dat
            dist/srs/geoip-ru.srs
            dist/srs/geoip-private.srs
            dist/srs/geosite-category-ru.srs
            dist/srs/geosite-private.srs
            dist/srs/geosite-category-ads.srs
            dist/text/*.txt
            dist/text/*.json
            dist/CHANGELOG.md

      # Снимок в истории GitHub Releases, только если базы реально изменились
      - name: Create dated historical release
        if: |
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
          steps.changelog.outputs.changed == 'true' &&
          (steps.commit_dist.outputs.dist_committed == 'true' ||
           github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch' ||
           github.event_name == 'push')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_prep.outputs.day_tag }}
          name: ${{ steps.release_prep.outputs.day_tag }}
          make_latest: false
          body_path: release_notes.md
          files: |
            dist/geoip-compact.dat
            dist/geosite-compact.dat
            dist/srs/geoip-ru.srs
            dist/srs/geoip-private.srs
            dist/srs/geosite-category-ru.srs
            dist/srs/geosite-private.srs
            dist/srs/geosite-category-ads.srs
            dist/text/*.txt
            dist/text/*.json
            dist/CHANGELOG.md
